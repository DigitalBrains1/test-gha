name: PR

on:
  pull_request:

jobs:
  ci_recipe:
    name: Construct CI recipe
    runs-on: ubuntu-slim
    outputs:
      recipe: ${{ steps.ci_recipe.outputs.recipe }}
    steps:
      - uses: actions/checkout@v6

      - id: ci_recipe
        run:
          .ci/ci_recipe.py pr


  ci:
    name: CI
    needs: ci_recipe
    uses: $/.github/workflows/ci.yaml
    with:
      recipe: ${{ needs.ci_recipe.outputs.recipe }}
    secrets: inherit


  qlog_entries:
    name: "Check qlog entries"
    runs-on: ubuntu-slim
    steps:
      - run: |
          echo This is the workflow file on main
          echo "PR number: ${{ github.event.pull_request.number }}"
          echo "GITHUB_REF = $GITHUB_REF"
          echo "GITHUB_WORKFLOW_REF = $GITHUB_WORKFLOW_REF"
          python3 -m json.tool $GITHUB_EVENT_PATH
          export
