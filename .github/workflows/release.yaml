on:
  create

jobs:
  dump:
    runs-on: ubuntu-slim
    steps:
      - env:
          GITHUB: ${{ toJSON(github) }}
          JOB: ${{ toJSON(job) }}
          RUNNER: ${{ toJSON(runner) }}
        run: |
          echo "-------------- github -------------"
          python3 -m json.tool - <<<$GITHUB
          echo "--------------- job ---------------"
          python3 -m json.tool - <<<$JOB
          echo "-------------- runner -------------"
          python3 -m json.tool - <<<$RUNNER
          echo
          export
