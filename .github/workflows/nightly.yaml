name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

jobs:
  schedule:
    name: Trigger from schedule
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run .github/workflows/nightly.yaml
          gh workflow run .github/workflows/nightly.yaml --ref 1.0
  ci-recipe:
    name: Construct CI recipe
    runs-on: ubuntu-latest
    outputs:
      recipe: ${{ steps.ci-recipe.outputs.recipe }}
    steps:
      - uses: actions/checkout@v6

      - id: ci-recipe
        run:
          .ci/ci-recipe.py nightly

  ci:
    name: CI
    needs: ci-recipe
    # uses: DigitalBrains1/test-gha/.github/workflows/ci.yaml@${{ github.head_ref }}
    uses: $/.github/workflows/ci.yaml
    with:
      recipe: ${{ needs.ci-recipe.outputs.recipe }}
    secrets: inherit
