name: On push

on:
#  push:
#    branches:
#      - main
#      - "1.0"
  workflow_dispatch:

jobs:
  ci_recipe:
    name: Construct CI recipe
    runs-on: ubuntu-slim
    outputs:
      recipe: ${{ steps.ci_recipe.outputs.recipe }}
    steps:
      - uses: actions/checkout@v6

      - id: ci_recipe
        run:
          .ci/ci_recipe.py nightly


  ci:
    name: CI
    needs: ci_recipe
    uses: $/.github/workflows/ci.yaml
    with:
      recipe: ${{ needs.ci_recipe.outputs.recipe }}
      hackage_publish: "no"
    secrets: inherit
