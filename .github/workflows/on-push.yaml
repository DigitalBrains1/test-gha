name: On push

on:
  push:
#    branches:
#      - main
#      - "1.0"
  workflow_dispatch:

jobs:
  multiline-output:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y bsdextrautils
      - uses: actions/checkout@v6
      - run: ./produce-output
        id: out
      - env:
          A: ${{ steps.out.outputs.A }}
          B: ${{ steps.out.outputs.B }}
          C: ${{ steps.out.outputs.C }}
          D: ${{ steps.out.outputs.D }}
        run: |
          set -x
          echo \""$A"\"
          hd <<<$A
          echo \""$B"\"
          hd <<<$B
          echo \""$C"\"
          hd <<<$C
          echo \""$D"\"
          hd <<<$D
          echo \""${{ steps.out.outputs.A }}"\"
          hd <<<"${{ steps.out.outputs.A }}"
          echo \""${{ steps.out.outputs.B }}"\"
          hd <<<"${{ steps.out.outputs.B }}"
          echo \""${{ steps.out.outputs.C }}"\"
          hd <<<"${{ steps.out.outputs.C }}"
          echo \""${{ steps.out.outputs.D }}"\"
          hd <<<"${{ steps.out.outputs.D }}"
